<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUFT Invites</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<style>
  :root {
    --bg: #0b0e1a; --panel: #131829; --panel-2: #1a2036; --line: #262d48; --field: #0e1222;
    --text: #e9ecf6; --muted: #8b93b3; --dim: #5c6485;
    --gold: #f2c14e; --gold-2: #d99a1e; --gold-ink: #2a1d02; --ok: #4cd5a0; --bad: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Ubuntu, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  header img { width: 36px; height: 36px; }
  header h1 { margin: 0; font-size: 18px; }
  header .spacer { flex: 1; }
  header .who { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .9px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px; }
  input { width: 100%; background: var(--field); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 11px; font: inherit; }
  input:focus { outline: 2px solid rgba(242,193,78,.45); border-color: transparent; }
  .row { display: grid; grid-template-columns: 90px 90px 1fr auto; gap: 10px; align-items: end; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr 1fr; } .row .note { grid-column: 1 / -1; } }
  button { font: inherit; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); padding: 9px 13px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: #3a4366; }
  button.primary { background: linear-gradient(180deg, var(--gold), var(--gold-2)); color: var(--gold-ink); border: 0; font-weight: 700; }
  button.small { padding: 5px 9px; font-size: 12.5px; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .login { max-width: 360px; margin: 40px auto; }
  .login .field { margin-bottom: 12px; }
  .login button { width: 100%; }
  .msg { min-height: 20px; margin-top: 10px; font-size: 13px; }
  .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
  .newlink { display: flex; gap: 8px; margin-top: 12px; }
  .newlink input { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--gold); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  td.actions { text-align: right; white-space: nowrap; }
  .tag { font-size: 12px; padding: 2px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .tag.ok { color: var(--ok); } .tag.bad { color: var(--bad); }
  .sub { color: var(--dim); font-size: 12px; }
  .empty { color: var(--dim); padding: 10px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section class="card login" id="loginView" hidden>
    <header style="justify-content:center;margin-bottom:14px"><img src="/static/logo.svg" alt=""><h1>OUFT invites</h1></header>
    <form id="loginForm">
      <div class="field"><label for="user">Username</label><input id="user" autocomplete="username" required></div>
      <div class="field"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit">Log in</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </section>

  <div id="appView" hidden>
    <header>
      <img src="/static/logo.svg" alt=""><h1>OUFT invites</h1>
      <span class="spacer"></span><span class="who" id="who"></span>
      <button class="small" id="logout">Log out</button>
    </header>

    <section class="card">
      <h2>New invite link</h2>
      <form id="createForm" class="row">
        <div><label for="uses">Players</label><input id="uses" type="number" min="1" max="20" value="1"></div>
        <div><label for="days">Valid days</label><input id="days" type="number" min="1" max="30" value="7"></div>
        <div class="note"><label for="note">Note (for you)</label><input id="note" maxlength="200" placeholder="e.g. for Markus"></div>
        <button class="primary" type="submit">Create link</button>
      </form>
      <div class="newlink" id="newLink" hidden><input id="newLinkText" readonly><button id="copyNew">Copy</button></div>
      <div class="msg" id="createMsg"></div>
    </section>

    <section class="card">
      <h2>Invites</h2>
      <table><thead><tr><th>Note</th><th>Used</th><th>Status</th><th>By</th><th></th></tr></thead>
        <tbody id="list"></tbody></table>
      <div class="empty" id="empty" hidden>No invites yet.</div>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let token = "", me = null;
try { token = localStorage.getItem("ouft_admin_token") || ""; } catch (e) {}

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(token ? { Authorization: token } : {}) };
  const r = await fetch(path, { ...opts, headers });
  const j = r.status === 204 ? {} : await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.message || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return j;
}
const linkFor = code => location.origin + "/register?invite=" + code;
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch (e) { $("newLinkText").select(); document.execCommand && document.execCommand("copy"); }
  const old = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = old, 1200);
}
function setToken(t) { token = t; try { t ? localStorage.setItem("ouft_admin_token", t) : localStorage.removeItem("ouft_admin_token"); } catch (e) {} }
function show(view) { $("loginView").hidden = view !== "login"; $("appView").hidden = view !== "app"; }

async function start() {
  if (!token) return show("login");
  try {
    const j = await api("/api/collections/users/auth-refresh", { method: "POST" });
    setToken(j.token); me = j.record;
    if (me.role !== "admin") { setToken(""); show("login"); $("loginMsg").className = "msg bad"; $("loginMsg").textContent = "Your account has no admin role."; return; }
    $("who").textContent = me.username; show("app"); load();
  } catch (e) { setToken(""); show("login"); }
}

$("loginForm").addEventListener("submit", async ev => {
  ev.preventDefault(); const msg = $("loginMsg"); msg.className = "msg"; msg.textContent = "Logging in…";
  try {
    const j = await api("/api/collections/users/auth-with-password", { method: "POST",
      body: JSON.stringify({ identity: $("user").value.trim(), password: $("pass").value }) });
    setToken(j.token); $("pass").value = ""; msg.textContent = ""; start();
  } catch (e) { msg.className = "msg bad"; msg.textContent = e.status === 429 ? "Too many attempts, wait a moment." : "Wrong username or password."; }
});
$("logout").onclick = () => { setToken(""); me = null; show("login"); };

$("createForm").addEventListener("submit", async ev => {
  ev.preventDefault(); const msg = $("createMsg"); msg.className = "msg"; msg.textContent = "Creating…";
  const days = Math.min(30, Math.max(1, parseInt($("days").value, 10) || 7));
  const expires = new Date(Date.now() + days * 86400000).toISOString().replace("T", " ");
  try {
    const inv = await api("/api/collections/invites/records", { method: "POST",
      body: JSON.stringify({ max_uses: Math.min(20, Math.max(1, parseInt($("uses").value, 10) || 1)), expires, note: $("note").value.trim() }) });
    $("newLinkText").value = linkFor(inv.code); $("newLink").hidden = false; $("note").value = "";
    msg.className = "msg ok"; msg.textContent = "Link created. Send it to the player(s); it works " + inv.max_uses + " time(s).";
    load();
  } catch (e) { msg.className = "msg bad"; msg.textContent = e.status === 403 ? "Not allowed (admin role needed)." : e.message; }
});
$("copyNew").onclick = ev => copy($("newLinkText").value, ev.target);

function status(inv) {
  if (inv.uses >= inv.max_uses) return ["used up", ""];
  if (inv.expires && new Date(inv.expires.replace(" ", "T")) < new Date()) return ["expired", "bad"];
  return ["open until " + new Date(inv.expires.replace(" ", "T")).toLocaleDateString(), "ok"];
}

async function load() {
  try {
    const j = await api("/api/collections/invites/records?sort=-created&perPage=100&expand=created_by,used_by");
    const rows = j.items.map(inv => {
      const tr = document.createElement("tr");
      const [st, cls] = status(inv);
      const used = (inv.expand?.used_by || []).map(u => u.username).join(", ");
      const by = inv.expand?.created_by?.username || "admin";
      tr.innerHTML = `<td></td><td></td><td><span class="tag ${cls}"></span></td><td class="sub"></td><td class="actions"></td>`;
      tr.cells[0].textContent = inv.note || "—";
      tr.cells[1].textContent = `${inv.uses}/${inv.max_uses}`;
      if (used) { const s = document.createElement("div"); s.className = "sub"; s.textContent = used; tr.cells[1].append(s); }
      tr.cells[2].firstChild.textContent = st;
      tr.cells[3].textContent = by;
      if (cls === "ok") {
        const c = document.createElement("button"); c.className = "small"; c.textContent = "Copy link";
        c.onclick = () => copy(linkFor(inv.code), c);
        tr.cells[4].append(c);
      }
      const d = document.createElement("button"); d.className = "small danger"; d.textContent = cls === "ok" ? "Revoke" : "Remove";
      d.onclick = async () => { d.disabled = true; try { await api("/api/collections/invites/records/" + inv.id, { method: "DELETE" }); load(); } catch (e) { d.disabled = false; } };
      tr.cells[4].append(" ", d);
      return tr;
    });
    $("list").replaceChildren(...rows); $("empty").hidden = rows.length > 0;
  } catch (e) { if (e.status === 401 || e.status === 403) { setToken(""); show("login"); } }
}
start();
</script>
</body>
</html>
