<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUFT</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<style>
  :root { --bg: #0b0e1a; --panel: #131829; --line: #262d48; --text: #e9ecf6; --muted: #8b93b3; --gold: #f2c14e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Ubuntu, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 56px 16px; text-align: center; }
  img { width: 128px; height: 128px; }
  h1 { margin: 16px 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; text-align: left; }
  .card p { margin: 0 0 10px; color: var(--muted); }
  .card p:last-child { margin: 0; }
  b { color: var(--text); }
  .gold { color: var(--gold); }
</style>
</head>
<body>
<main>
  <img src="/static/logo.svg" alt="OUFT crest">
  <h1>OUFT</h1>
  <p class="sub">Open Ultimate Football Team</p>
  <div class="card">
    <p>OUFT is a small, <b>invite-only</b> community server for playing online matches with friends.</p>
    <p>Got an invite link? Open it to create your account, then log in with <b class="gold">OUFT Online</b>.</p>
  </div>
</main>
</body>
</html>
