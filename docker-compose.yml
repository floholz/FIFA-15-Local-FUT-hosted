# OUFT server stack. One command:   docker compose up -d --build
# Settings come from .env (copy .env.example).
#
#   traefik    HTTPS for the web app at OUFT_DOMAIN (its own instance, bound to OUFT_PUBLIC_IP only)
#   accounts   OUFT accounts: invite-only registration, login, internal API for game servers
#   fut15      the FIFA 15 game server (host networking: game ports + UDP relay; state in FUT15_STATE_DIR)
#
# Admin: docker compose exec accounts ouft-accounts invite --uses 1 --days 7
#        docker compose exec accounts ouft-accounts superuser upsert EMAIL PASSWORD   (dashboard: /_/)
name: ouft

services:
  traefik:
    image: traefik:v3.4
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${OUFT_ACME_EMAIL:?set OUFT_ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --log.level=INFO
    environment:
      OUFT_DOMAIN: ${OUFT_DOMAIN:-ouft.fhun.site}
    ports:
      # Only the public address: other proxies on the host (e.g. a tailnet-only Traefik
      # on the Tailscale IP) keep their own :80/:443.
      - "${OUFT_PUBLIC_IP:?set OUFT_PUBLIC_IP in .env}:80:80"
      - "${OUFT_PUBLIC_IP}:443:443"
    volumes:
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/acme
    depends_on:
      accounts:
        condition: service_healthy

  accounts:
    build:
      context: .
      dockerfile: deploy/accounts.Dockerfile
    restart: unless-stopped
    environment:
      OUFT_PUBLIC_URL: https://${OUFT_DOMAIN:-ouft.fhun.site}
      # name:key pairs for game servers, e.g. fut15:<long random key>
      OUFT_SERVICE_KEYS: ${OUFT_SERVICE_KEYS:-}
    ports:
      # Internal API for game servers on the host network (fut15 runs with network_mode: host).
      - "127.0.0.1:${OUFT_ACCOUNTS_LOCAL_PORT:-8095}:8090"
    volumes:
      - accounts-data:/pb_data

  fut15:
    build: .
    container_name: fut15-server
    restart: unless-stopped
    # Host networking: the server binds many ports (6 fixed TCP services + a
    # dynamic UDP match-relay range), and the relay MUST see each client's real
    # source address to forward gameplay between them. Docker's bridge NAT both
    # fails to forward the dynamic UDP ports and rewrites source IPs, which
    # breaks the relay — so share the host network stack directly. The server
    # binds 0.0.0.0 on the host; open the ports on the VPS/cloud firewall.
    network_mode: host
    # Same owner as the state directory, so a manual start-server.sh can still use it.
    user: "${FUT15_UID:-1000}:${FUT15_GID:-1000}"
    environment:
      # The address players connect to (DNS name or VPS IP).
      PUBLIC_HOST: "${PUBLIC_HOST:-fut15.fhun.site}"
      # Old login (launchers before 15.1): clients must send this code.
      FUT15_SERVER_ACCESS_CODE: "${SERVER_ACCESS_CODE:-}"
      # Optional extra gate for the old login: only these names, comma-separated.
      FUT15_ALLOWED_PLAYERS: "${ALLOWED_PLAYERS:-}"
      # OUFT account login: the accounts service's internal API on this host, and the
      # service keys (the server picks its "fut15:" entry).
      FUT15_ACCOUNTS_URL: "http://127.0.0.1:${OUFT_ACCOUNTS_LOCAL_PORT:-8095}"
      FUT15_ACCOUNTS_KEY: "${OUFT_SERVICE_KEYS:-}"
      # 1 = refuse the old login (once every player uses OUFT Online 15.1+).
      FUT15_REQUIRE_ACCOUNT: "${FUT15_REQUIRE_ACCOUNT:-0}"
      FUT15_DEBUG_DUMPS: "${FUT15_DEBUG_DUMPS:-0}"
    volumes:
      # Users, clubs and logs. Point FUT15_STATE_DIR at an existing server state
      # directory to keep its clubs (e.g. ~/.local/share/fifa15-local-fut-server).
      - "${FUT15_STATE_DIR:-./data/fut15}:/data"
    depends_on:
      accounts:
        condition: service_healthy

volumes:
  traefik-acme:
  accounts-data:
